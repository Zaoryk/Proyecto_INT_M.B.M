<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Página no encontrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
    }
    .error-container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      text-align: center;
      padding: 20px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: #dc3545;
      line-height: 1;
    }
    .error-message {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .error-submessage {
      color: #6c757d;
      margin-bottom: 2rem;
    }
    .btn-home {
      padding: .75rem 1.5rem;
      background-color: #dc3545;
      font-size: 1rem;
      color: #fff;
      border: none;
    }
    .btn-home:hover,
    .btn-home:focus,
    .btn-home:active {
      background-color: #dc3545 !important;
      color: #fff !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

<div class="error-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="error-content">
          <div class="error-code">404</div>
          <div class="error-message">Oops! Página no encontrada.</div>
          <div class="error-submessage">Lo sentimos, pero la página que estás buscando no existe o ha sido movida.</div>
          <a href="/" class="btn btn-home">Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
