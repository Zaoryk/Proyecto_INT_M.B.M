{% extends "accounts/base.html" %}
{% load static %}
{% block content %}

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="card p-4 shadow-lg" style="max-width: 450px; width: 100%; background-color: #D10A11; border: none; border-radius: 15px;">
        <div class="container d-flex flex-column align-items-center justify-content-center">
            <img src="{% static 'img/LOGO-Lilis-2-03.png' %}" alt="Logo Dulcería Lili's" style="width: 120px; margin-bottom: 20px;">
        </div>
        
        <h3 class="text-center mb-3" style="color: #fff;">Código de Verificación</h3>
        <p class="text-center text-light mb-4">
            Ingresa el código de 6 dígitos enviado a:<br>
            <strong>{{ email }}</strong>
        </p>

        <form method="post" action="{% url 'password_validar' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label text-light">Código de verificación</label>
                <input type="text" class="form-control text-center" name="code" required 
                       placeholder="000000" maxlength="6" pattern="\d{6}"
                       style="font-size: 1.5rem; letter-spacing: 0.5rem;" />
                <small class="form-text text-light">El código expira en 15 minutos</small>
            </div>

            <button type="submit" class="btn btn-light w-100 fw-bold mb-3">
                <i class="bi bi-check-circle-fill me-2"></i>Verificar Código
            </button>

            <div class="text-center">
                <a href="{% url 'password_solicitud' %}" class="text-light" style="text-decoration: underline;">
                    ¿No recibiste el código? Solicitar uno nuevo
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const codeInput = document.querySelector('input[name="code"]');
    
    // Solo permitir números
    codeInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
    });
});
</script>

{% endblock %}
