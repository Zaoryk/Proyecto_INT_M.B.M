{% extends "accounts/base.html" %}
{% load static %}
{% block content %}

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="card p-4 shadow-lg" style="max-width: 450px; width: 100%; background-color: #D10A11; border: none; border-radius: 15px;">
        <div class="container d-flex flex-column align-items-center justify-content-center">
            <img src="{% static 'img/LOGO-Lilis-2-03.png' %}" alt="Logo Dulcería Lili's" style="width: 120px; margin-bottom: 20px;">
        </div>
        
        <h3 class="text-center mb-3" style="color: #fff;">Nueva Contraseña</h3>
        <p class="text-center text-light mb-4">
            Establece tu nueva contraseña
        </p>

        <form method="post" action="{% url 'password_cambio' %}" id="resetForm">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label text-light">Nueva contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password1" id="password1" required 
                           placeholder="Mínimo 8 caracteres" minlength="8" />
                    <button class="btn btn-outline-light" type="button" id="togglePassword1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <small class="form-text text-light">Mínimo 8 caracteres, 1 mayúscula y 1 número</small>
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Confirmar contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password2" id="password2" required 
                           placeholder="Repite tu contraseña" minlength="8" />
                    <button class="btn btn-outline-light" type="button" id="togglePassword2">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-light w-100 fw-bold mb-3">
                <i class="bi bi-shield-check me-2"></i>Restablecer Contraseña
            </button>

            <div class="text-center">
                <a href="{% url 'login' %}" class="text-light" style="text-decoration: underline;">
                    <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn1 = document.getElementById('togglePassword1');
    const passwordField1 = document.getElementById('password1');
    const toggleBtn2 = document.getElementById('togglePassword2');
    const passwordField2 = document.getElementById('password2');
    const form = document.getElementById('resetForm');

    // Toggle password visibility
    if (toggleBtn1 && passwordField1) {
        toggleBtn1.addEventListener('click', function() {
            const isPassword = passwordField1.type === 'password';
            passwordField1.type = isPassword ? 'text' : 'password';
            toggleBtn1.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    }

    if (toggleBtn2 && passwordField2) {
        toggleBtn2.addEventListener('click', function() {
            const isPassword = passwordField2.type === 'password';
            passwordField2.type = isPassword ? 'text' : 'password';
            toggleBtn2.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    }

    // Validación del formulario
    form.addEventListener('submit', function(e) {
        const password1 = passwordField1.value;
        const password2 = passwordField2.value;

        // Verificar que coincidan
        if (password1 !== password2) {
            e.preventDefault();
            Swal.fire({
                icon: 'error',
                title: 'Las contraseñas no coinciden',
                text: 'Por favor verifica que ambas contraseñas sean iguales.'
            });
            return;
        }

        // Validar formato
        const passRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
        if (!passRegex.test(password1)) {
            e.preventDefault();
            Swal.fire({
                icon: 'error',
                title: 'Contraseña insegura',
                text: 'Debe tener al menos 8 caracteres, una mayúscula y un número.'
            });
            return;
        }
    });
});
</script>

{% endblock %}
