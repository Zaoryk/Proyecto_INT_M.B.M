{% extends "accounts/base.html" %}
{% load static %}
{% block content %}

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="card p-4 shadow-lg" style="max-width: 450px; width: 100%; background-color: #D10A11; border: none; border-radius: 15px;">
        <div class="container d-flex flex-column align-items-center justify-content-center">
            <img src="{% static 'img/LOGO-Lilis-2-03.png' %}" alt="Logo Dulcería Lili's" style="width: 120px; margin-bottom: 20px;">
        </div>
        
        <h3 class="text-center mb-3" style="color: #fff;">Recuperar Contraseña</h3>
        <p class="text-center text-light mb-4">
            Ingresa tu correo electrónico y te enviaremos un código de verificación.
        </p>

        <form method="post" action="{% url 'password_solicitud' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label text-light">Correo electrónico o Usuario</label>
                <input type="text" class="form-control" name="email" required 
                       placeholder="tu@email.com o usuario" />
            </div>

            <button type="submit" class="btn btn-light w-100 fw-bold mb-3">
                <i class="bi bi-envelope-fill me-2"></i>Enviar Código
            </button>

            <div class="text-center">
                <a href="{% url 'login' %}" class="text-light" style="text-decoration: underline;">
                    <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
