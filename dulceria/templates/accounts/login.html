{% extends "accounts/base.html" %}
{% load static %}
{% block content %}

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">

  <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%; background-color: #D10A11; border: none; border-radius: 15px;">
    <div class="container d-flex flex-column align-items-center justify-content-center">
      <img src="{% static 'img/LOGO-Lilis-2-03.png' %}" alt="Logo Dulcería Lili's" style="width: 120px; margin-bottom: 20px;">
    </div>
    <h3 class="text-center mb-2" style="color: #fff;">Iniciar sesión</h3>

    <!-- Mensajes de error/éxito -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert 
                    {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} 
                    py-2 mt-2">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label text-light">Usuario</label>
        <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-light">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
      </div>

      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <button type="submit" class="btn btn-light w-100 fw-bold">Ingresar</button>

      <div class="text-center mt-3">
        <a href="#" class="text-light" style="text-decoration: underline;">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
